AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Relevance API lab (companion to "A Million Questions a Second"). A DynamoDB table and an S3 bucket
  for versioned data, an Auto Scaling group of API hosts behind an Application Load Balancer with
  target tracking and slow start, and one load-generator instance driven through Systems Manager.
  This creates billable resources. Delete the stack when you are done.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: A VPC with public subnets (the default VPC works).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different Availability Zones.
  AllowedCidr:
    Type: String
    Description: Who may call the load balancer, e.g. your IP as 203.0.113.7/32.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  InstanceType:
    Type: String
    Default: c7i.large
    Description: API host size.
  LoadGenInstanceType:
    Type: String
    Default: c7i.2xlarge
    Description: Load generator size (more vCPUs = more generator processes).
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 6
  TargetRequestsPerHostPerMinute:
    Type: Number
    Default: 30000
    Description: Target tracking goal (ALBRequestCountPerTarget is counted per minute; 30000 = 500 req/s).
  LabZipUrl:
    Type: String
    Default: https://tascano.github.io/notes/relevance-lab.zip
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: k
          AttributeType: S
      KeySchema:
        - AttributeName: k
          KeyType: HASH
      TimeToLiveSpecification:   # old versions expire on their own
        AttributeName: expires_at
        Enabled: true

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # shell access without SSH
      Policies:
        - PolicyName: read-relevance-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:GetItem]
                Resource: !GetAtt ScoresTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/*

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relevance lab load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relevance lab API hosts (only the load balancer may connect)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadGenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relevance lab load generator (no inbound access; driven through SSM)
      VpcId: !Ref VpcId

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /healthz        # healthy only once a data version is loaded
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: slow_start.duration_seconds   # new hosts warm up before taking a full share
          Value: "60"
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt HostProfile.Arn}
        SecurityGroupIds: [!Ref HostSecurityGroup]
        MetadataOptions: {HttpTokens: required}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y python3.11 python3.11-pip unzip
            mkdir -p /opt/lab && cd /opt/lab
            curl -fsSL "${LabZipUrl}" -o lab.zip && unzip -o lab.zip
            python3.11 -m venv /opt/lab/venv
            /opt/lab/venv/bin/pip install -q -r /opt/lab/relevance-lab/requirements.txt
            cat > /etc/systemd/system/relevance.service <<'UNIT'
            [Unit]
            Description=Relevance API lab
            After=network-online.target
            [Service]
            WorkingDirectory=/opt/lab/relevance-lab
            Environment=BUCKET=${DataBucket}
            Environment=AWS_DEFAULT_REGION=${AWS::Region}
            Environment=DATA_DIR=/opt/lab/data
            Environment=POLL_SECONDS=30
            ExecStart=/opt/lab/venv/bin/uvicorn service:app --host 0.0.0.0 --port 8000 --workers 2
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now relevance

  HostGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref SubnetIds
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref MinSize
      HealthCheckType: EC2          # the load balancer still routes only to hosts whose /healthz is green
      HealthCheckGracePeriod: 300
      TargetGroupARNs: [!Ref TargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref HostLaunchTemplate
        Version: !GetAtt HostLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: relevance-lab-host
          PropagateAtLaunch: true

  RequestsPerHostPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref HostGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: !Ref TargetRequestsPerHostPerMinute
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ["/", [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt TargetGroup.TargetGroupFullName]]

  LoadGenIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  AlbFromLoadGen:   # traffic to an internet-facing load balancer arrives from the generator's public IP
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Sub ${LoadGenIp.PublicIp}/32

  LoadGenInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref LoadGenInstanceType
      IamInstanceProfile: !Ref HostProfile
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref LoadGenSecurityGroup]
      Tags:
        - Key: Name
          Value: relevance-lab-loadgen
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y python3.11 python3.11-pip unzip
          mkdir -p /opt/lab && cd /opt/lab
          curl -fsSL "${LabZipUrl}" -o lab.zip && unzip -o lab.zip
          python3.11 -m venv /opt/lab/venv
          /opt/lab/venv/bin/pip install -q -r /opt/lab/relevance-lab/requirements.txt

  LoadGenIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt LoadGenIp.AllocationId
      InstanceId: !Ref LoadGenInstance

Outputs:
  ApiUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  TableName:
    Value: !Ref ScoresTable
  BucketName:
    Value: !Ref DataBucket
  HostGroupName:
    Value: !Ref HostGroup
  LoadBalancerFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  LoadGenInstanceId:
    Value: !Ref LoadGenInstance
